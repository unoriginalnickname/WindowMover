    }
    @keyframes pg0 {
      0% { opacity: 0; }
      4.93% { opacity: 0; }
      5.91% { opacity: 1; }
      25.12% { opacity: 1; }
      26.11% { opacity: 0.4; }
      100% { opacity: 0.4; }
    }
    @keyframes pg1 {
      0% { opacity: 0; }
      26.11% { opacity: 0; }
      27.09% { opacity: 1; }
      48.28% { opacity: 1; }
      49.26% { opacity: 0.4; }
      100% { opacity: 0.4; }
    }
    @keyframes pg2 {
      0% { opacity: 0; }
      49.26% { opacity: 0; }
      50.25% { opacity: 1; }
      71.43% { opacity: 1; }
      72.41% { opacity: 0.4; }
      100% { opacity: 0.4; }
    }
    @keyframes pg3 {
      0% { opacity: 0; }
      72.41% { opacity: 0; }
      73.4% { opacity: 1; }
      92.61% { opacity: 1; }
      93.6% { opacity: 0.4; }
      100% { opacity: 0.4; }
    }
    @keyframes loop {
      0% { opacity: 0; }
      2.46% { opacity: 1; }
      96.06% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>

  <rect width="706" height="262" rx="12" fill="#0d1117"/>
  <g class="loop">

  <!-- the mouse, seen from above: Mouse5 is the upper side button, Mouse4 the lower one -->
  <g transform="translate(36 104) scale(1.15)">
