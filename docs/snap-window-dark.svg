<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 706 262" width="706" height="262" role="img" aria-labelledby="t d">
  <title id="t">Filling half the screen with the focused window</title>
  <desc id="d">A mouse with Ctrl and Shift keys above it, four steps, and a monitor whose blue window has focus, in the middle of the screen. Ctrl and Shift are held; Mouse4 is pressed and the window fills the left half of the screen, then Mouse5 is pressed and it fills the right half. Then Ctrl and Shift are released.</desc>
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .st1, .st2, .st3, .st4, .keys1, .keys4, .lead4, .lead5, .keyon, .m4, .m5, .half4, .half5, .pgbar { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .pgbar { opacity: 1; }
      .pg0 { animation: pg0 20.3s infinite; }
      .pg1 { animation: pg1 20.3s infinite; }
      .pg2 { animation: pg2 20.3s infinite; }
      .pg3 { animation: pg3 20.3s infinite; }
      .past1 { animation: done1 20.3s infinite; }
      .past2 { animation: done2 20.3s infinite; }
      .past3 { animation: done3 20.3s infinite; }
      .st1 { animation: step1 20.3s infinite; }
      .st2 { animation: step2 20.3s infinite; }
      .st3 { animation: step3 20.3s infinite; }
      .st4 { animation: step4 20.3s infinite; }
      .keys1 { animation: keys1 20.3s infinite; }
      .keys4 { animation: keys4 20.3s infinite; }
      .lead4 { animation: lead4 20.3s infinite; }
      .lead5 { animation: lead5 20.3s infinite; }
      .keyon { animation: keyon 20.3s infinite; }
      .m4 { animation: m4 20.3s infinite; }
      .m5 { animation: m5 20.3s infinite; }
      .snap { animation: snap 20.3s infinite; }
      .half4 { animation: half4 20.3s infinite; }
      .half5 { animation: half5 20.3s infinite; }
      .loop { animation: loop 20.3s infinite; }
    }
    @keyframes step1 {
      0% { opacity: 0; }
      4.93% { opacity: 0; }
      5.91% { opacity: 1; }
      25.12% { opacity: 1; }
      26.11% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes step2 {
      0% { opacity: 0; }
      26.11% { opacity: 0; }
      27.09% { opacity: 1; }
      48.28% { opacity: 1; }
      49.26% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes step3 {
      0% { opacity: 0; }
      49.26% { opacity: 0; }
      50.25% { opacity: 1; }
      71.43% { opacity: 1; }
      72.41% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes step4 {
      0% { opacity: 0; }
      72.41% { opacity: 0; }
      73.4% { opacity: 1; }
      92.61% { opacity: 1; }
      93.6% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes done1 {
      0% { opacity: 0; }
      25.12% { opacity: 0; }
      26.11% { opacity: 1; }
      92.61% { opacity: 1; }
      93.6% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes done2 {
