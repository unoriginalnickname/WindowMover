      <rect x="100" y="163" width="16" height="12" rx="2" fill="#6d8794"/><rect x="104" y="166" width="3" height="3" fill="#1c2128" opacity="0.55"/><rect x="104" y="170" width="3" height="3" fill="#1c2128" opacity="0.55"/><rect x="110" y="166" width="3" height="3" fill="#1c2128" opacity="0.55"/><rect x="110" y="170" width="3" height="3" fill="#1c2128" opacity="0.55"/>
