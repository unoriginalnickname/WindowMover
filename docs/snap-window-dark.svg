    }
    @keyframes m5 {
      0% { opacity: 0; }
      51.23% { opacity: 0; }
      51.72% { opacity: 1; }
      71.43% { opacity: 1; }
      71.92% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes snap {
      0% { transform: translate(0.00px, 0.00px) scale(1.0000, 1.0000); animation-timing-function: cubic-bezier(0.2, 0, 0.38, 0.9); }
      28.57% { transform: translate(0.00px, 0.00px) scale(1.0000, 1.0000); animation-timing-function: cubic-bezier(0.2, 0, 0.38, 0.9); }
      31.03% { transform: translate(-60.00px, -83.75px) scale(1.0000, 1.6250); animation-timing-function: cubic-bezier(0.2, 0, 0.38, 0.9); }
      51.72% { transform: translate(-60.00px, -83.75px) scale(1.0000, 1.6250); animation-timing-function: cubic-bezier(0.2, 0, 0.38, 0.9); }
      54.19% { transform: translate(60.00px, -83.75px) scale(1.0000, 1.6250); }
      100% { transform: translate(60.00px, -83.75px) scale(1.0000, 1.6250); }
    }
    @keyframes half4 {
