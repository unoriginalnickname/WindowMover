      48.28% { opacity: 0; }
      49.26% { opacity: 1; }
      92.61% { opacity: 1; }
      93.6% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes done3 {
      0% { opacity: 0; }
      71.43% { opacity: 0; }
      72.41% { opacity: 1; }
      92.61% { opacity: 1; }
      93.6% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes keys1 {
      0% { opacity: 0; }
      4.93% { opacity: 0; }
      5.91% { opacity: 1; }
      71.43% { opacity: 1; }
      72.41% { opacity: 0; }
      100% { opacity: 0; }
