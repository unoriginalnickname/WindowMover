    <path d="M40 27 H280 A3 3 0 0 1 283 30 V197 A3 3 0 0 1 280 200 H40 A3 3 0 0 1 37 197 V30 A3 3 0 0 1 40 27 Z" fill="#000000"/><path d="M37 180 H283 V197 A3 3 0 0 1 280 200 H40 A3 3 0 0 1 37 197 Z" fill="#000000"/>
