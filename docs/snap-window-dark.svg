    <line x1="0" y1="42" x2="70" y2="42" stroke="#c9d1d9" stroke-width="2.4"/>
    <line x1="35" y1="0" x2="35" y2="42" stroke="#c9d1d9" stroke-width="2.4"/>
    <rect x="29" y="12" width="12" height="22" rx="6" fill="#30363d" stroke="#c9d1d9" stroke-width="1.8"/>
    <rect x="-8" y="40" width="10" height="14" rx="3" fill="#30363d" stroke="#c9d1d9" stroke-width="1.8"/>
    <rect x="-8" y="60" width="10" height="14" rx="3" fill="#30363d" stroke="#c9d1d9" stroke-width="1.8"/>
    <rect class="m5" x="-10" y="38" width="14" height="18" rx="4" fill="#f0883e"/>
    <rect class="m4" x="-10" y="58" width="14" height="18" rx="4" fill="#f0883e"/>
  </g>

  <!-- Ctrl and Shift, lit while held -->
  <g font-size="12" text-anchor="middle">
    <rect x="26" y="36" width="44" height="21" rx="4" fill="#30363d" stroke="#c9d1d9" stroke-width="1.6"/><text x="48" y="51" fill="#c9d1d9">Ctrl</text><rect x="78" y="36" width="56" height="21" rx="4" fill="#30363d" stroke="#c9d1d9" stroke-width="1.6"/><text x="106" y="51" fill="#c9d1d9">Shift</text>
    <g class="keyon"><rect x="26" y="36" width="44" height="21" rx="4" fill="#f0883e" stroke="#f0883e" stroke-width="1.6"/><text x="48" y="51" fill="#ffffff">Ctrl</text><rect x="78" y="36" width="56" height="21" rx="4" fill="#f0883e" stroke="#f0883e" stroke-width="1.6"/><text x="106" y="51" fill="#ffffff">Shift</text></g>
  </g>

  <!-- the steps, and the leaders from each step to its key or button -->
  <g font-size="15">
    <text x="156" y="48" font-size="16" font-weight="600" fill="#f0f6fc">Half the screen</text>
    <g class="past1"><circle cx="160" cy="77" r="3" fill="#6e7681"/><text x="170" y="82" fill="#6e7681">Hold Ctrl+Shift</text></g><g class="st1"><circle cx="160" cy="77" r="3.5" fill="#f0883e"/><text x="170" y="82" fill="#f0f6fc">Hold Ctrl+Shift</text></g>
    <g class="past2"><circle cx="160" cy="112" r="3" fill="#6e7681"/><text x="170" y="117" fill="#6e7681">Mouse4: left half</text></g><g class="st2"><circle cx="160" cy="112" r="3.5" fill="#f0883e"/><text x="170" y="117" fill="#f0f6fc">Mouse4: left half</text></g>
    <g class="past3"><circle cx="160" cy="147" r="3" fill="#6e7681"/><text x="170" y="152" fill="#6e7681">Mouse5: right half</text></g><g class="st3"><circle cx="160" cy="147" r="3.5" fill="#f0883e"/><text x="170" y="152" fill="#f0f6fc">Mouse5: right half</text></g>
    <g class="st4"><circle cx="160" cy="182" r="3.5" fill="#f0883e"/><text x="170" y="187" fill="#f0f6fc">Release Ctrl+Shift</text></g>
  </g>
  <g class="pgbar"><rect x="156" y="226" width="22" height="5" rx="2.5" fill="#6e7681" opacity="0.45"/><rect x="182" y="226" width="22" height="5" rx="2.5" fill="#6e7681" opacity="0.45"/><rect x="208" y="226" width="22" height="5" rx="2.5" fill="#6e7681" opacity="0.45"/><rect x="234" y="226" width="22" height="5" rx="2.5" fill="#6e7681" opacity="0.45"/><rect class="pg0" x="156" y="226" width="22" height="5" rx="2.5" fill="#f0883e"/><rect class="pg1" x="182" y="226" width="22" height="5" rx="2.5" fill="#f0883e"/><rect class="pg2" x="208" y="226" width="22" height="5" rx="2.5" fill="#f0883e"/><rect class="pg3" x="234" y="226" width="22" height="5" rx="2.5" fill="#f0883e"/></g>
  <g fill="none" stroke="#f0883e" stroke-width="1.6" stroke-linejoin="round">
    <path class="keys1" d="M154 77 H142 V66 H48 V57 M106 66 V57"/>
    <path class="keys4" d="M154 182 H142 V66 H48 V57 M106 66 V57"/>
