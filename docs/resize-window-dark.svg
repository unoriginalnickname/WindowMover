      49.11% { opacity: 1; }
      49.78% { opacity: 1; }
      50% { opacity: 0; }
      50.67% { opacity: 0; }
      50.89% { opacity: 1; }
      51.56% { opacity: 1; }
      51.79% { opacity: 0; }
      52.46% { opacity: 0; }
      52.68% { opacity: 1; }
      53.35% { opacity: 1; }
      53.57% { opacity: 0; }
      54.24% { opacity: 0; }
      54.46% { opacity: 1; }
      55.13% { opacity: 1; }
      55.36% { opacity: 0; }
      56.03% { opacity: 0; }
      56.25% { opacity: 1; }
      56.92% { opacity: 1; }
      57.14% { opacity: 0; }
      57.81% { opacity: 0; }
      58.04% { opacity: 1; }
      74.11% { opacity: 1; }
      74.33% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes was {
