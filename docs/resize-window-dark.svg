    <g class="keyon"><rect x="26" y="36" width="44" height="21" rx="4" fill="#f0883e" stroke="#f0883e" stroke-width="1.6"/><text x="48" y="51" fill="#ffffff">Ctrl</text><rect x="78" y="36" width="56" height="21" rx="4" fill="#f0883e" stroke="#f0883e" stroke-width="1.6"/><text x="106" y="51" fill="#ffffff">Shift</text></g>
  </g>

  <!-- the steps, and the leaders from each step to its key or button -->
  <g font-size="15">
    <text x="156" y="48" font-size="16" font-weight="600" fill="#f0f6fc">Resize the focused window</text>
    <circle cx="160" cy="77" r="3" fill="#6e7681"/><text x="170" y="82" fill="#6e7681">Hold Ctrl+Shift and…</text><g class="st1"><circle cx="160" cy="77" r="3.5" fill="#f0883e"/><text x="170" y="82" fill="#f0f6fc">Hold Ctrl+Shift and…</text></g>
    <circle cx="160" cy="112" r="3" fill="#6e7681"/><text x="170" y="117" fill="#6e7681">…scroll up to make the window bigger</text><g class="st2"><circle cx="160" cy="112" r="3.5" fill="#f0883e"/><text x="170" y="117" fill="#f0f6fc">…scroll up to make the window bigger</text></g>
    <circle cx="160" cy="147" r="3" fill="#6e7681"/><text x="170" y="152" fill="#6e7681">…scroll down to make it smaller</text><g class="st3"><circle cx="160" cy="147" r="3.5" fill="#f0883e"/><text x="170" y="152" fill="#f0f6fc">…scroll down to make it smaller</text></g>
    <circle cx="160" cy="182" r="3" fill="#6e7681"/><text x="170" y="187" fill="#6e7681">Now you can release Ctrl+Shift</text><g class="st4"><circle cx="160" cy="182" r="3.5" fill="#f0883e"/><text x="170" y="187" fill="#f0f6fc">Now you can release Ctrl+Shift</text></g>
  </g>
