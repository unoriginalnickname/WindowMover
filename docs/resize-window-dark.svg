    }
    @keyframes grow {
      0% { transform: translate(0.00px, 0.00px) scale(1.0000, 1.0000); animation-timing-function: ease-out; }
      25.89% { transform: translate(0.00px, 0.00px) scale(1.0000, 1.0000); animation-timing-function: ease-out; }
      26.56% { transform: translate(-16.00px, -11.00px) scale(1.1000, 1.1000); }
      27.68% { transform: translate(-16.00px, -11.00px) scale(1.1000, 1.1000); animation-timing-function: ease-out; }
      28.35% { transform: translate(-33.60px, -23.10px) scale(1.2100, 1.2100); }
      29.46% { transform: translate(-33.60px, -23.10px) scale(1.2100, 1.2100); animation-timing-function: ease-out; }
      30.13% { transform: translate(-52.96px, -39.65px) scale(1.3310, 1.3310); }
      48.88% { transform: translate(-52.96px, -39.65px) scale(1.3310, 1.3310); animation-timing-function: ease-out; }
      49.55% { transform: translate(-33.60px, -26.34px) scale(1.2100, 1.2100); }
      50.67% { transform: translate(-33.60px, -26.34px) scale(1.2100, 1.2100); animation-timing-function: ease-out; }
      51.34% { transform: translate(-16.00px, -14.24px) scale(1.1000, 1.1000); }
      52.46% { transform: translate(-16.00px, -14.24px) scale(1.1000, 1.1000); animation-timing-function: ease-out; }
      53.12% { transform: translate(0.00px, -3.24px) scale(1.0000, 1.0000); }
      54.24% { transform: translate(0.00px, -3.24px) scale(1.0000, 1.0000); animation-timing-function: ease-out; }
      54.91% { transform: translate(14.55px, 6.76px) scale(0.9091, 0.9091); }
      56.03% { transform: translate(14.55px, 6.76px) scale(0.9091, 0.9091); animation-timing-function: ease-out; }
      56.7% { transform: translate(27.77px, 15.85px) scale(0.8264, 0.8264); }
      57.81% { transform: translate(27.77px, 15.85px) scale(0.8264, 0.8264); animation-timing-function: ease-out; }
      58.48% { transform: translate(39.79px, 24.12px) scale(0.7513, 0.7513); }
      100% { transform: translate(39.79px, 24.12px) scale(0.7513, 0.7513); }
    }
    @keyframes pg0 {
      0% { opacity: 0; }
      4.46% { opacity: 0; }
      5.36% { opacity: 1; }
      22.77% { opacity: 1; }
      23.66% { opacity: 0.4; }
      100% { opacity: 0.4; }
    }
    @keyframes pg1 {
      0% { opacity: 0; }
      23.66% { opacity: 0; }
      24.55% { opacity: 1; }
      45.76% { opacity: 1; }
      46.65% { opacity: 0.4; }
      100% { opacity: 0.4; }
    }
    @keyframes pg2 {
      0% { opacity: 0; }
      46.65% { opacity: 0; }
      47.54% { opacity: 1; }
      74.11% { opacity: 1; }
      75% { opacity: 0.4; }
      100% { opacity: 0.4; }
    }
    @keyframes pg3 {
      0% { opacity: 0; }
      75% { opacity: 0; }
      75.89% { opacity: 1; }
      93.3% { opacity: 1; }
      94.2% { opacity: 0.4; }
      100% { opacity: 0.4; }
    }
    @keyframes loop {
      0% { opacity: 0; }
      2.23% { opacity: 1; }
      96.43% { opacity: 1; }
      100% { opacity: 0; }
    }
