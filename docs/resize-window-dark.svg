      0% { opacity: 0; }
      4.46% { opacity: 0; }
      5.36% { opacity: 1; }
      22.77% { opacity: 1; }
      23.66% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes step2 {
      0% { opacity: 0; }
      23.66% { opacity: 0; }
      24.55% { opacity: 1; }
      45.76% { opacity: 1; }
      46.65% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes step3 {
      0% { opacity: 0; }
      46.65% { opacity: 0; }
      47.54% { opacity: 1; }
      74.11% { opacity: 1; }
      75% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes step4 {
      0% { opacity: 0; }
      75% { opacity: 0; }
      75.89% { opacity: 1; }
      93.3% { opacity: 1; }
      94.2% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes keys1 {
      0% { opacity: 0; }
      4.46% { opacity: 0; }
      5.36% { opacity: 1; }
      74.11% { opacity: 1; }
      75% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes keys4 {
      0% { opacity: 0; }
      75% { opacity: 0; }
      75.89% { opacity: 1; }
      93.3% { opacity: 1; }
      94.2% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes leadup {
      0% { opacity: 0; }
      23.66% { opacity: 0; }
      24.55% { opacity: 1; }
      45.76% { opacity: 1; }
      46.65% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes leaddn {
      0% { opacity: 0; }
      46.65% { opacity: 0; }
      47.54% { opacity: 1; }
      74.11% { opacity: 1; }
      75% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes keyon {
      0% { opacity: 0; }
      6.7% { opacity: 0; }
      7.14% { opacity: 1; }
      77.23% { opacity: 1; }
      77.68% { opacity: 0; }
