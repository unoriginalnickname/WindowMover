<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 706 262" width="706" height="262" role="img" aria-labelledby="t d">
  <title id="t">Resizing the focused window</title>
  <desc id="d">A mouse with Ctrl and Shift keys above it, four steps, and a monitor whose blue window has focus. Ctrl and Shift are held; the wheel scrolls up and the window grows a notch at a time, then scrolls down and it shrinks below the size it started at, which a dashed outline marks. Then Ctrl and Shift are released.</desc>
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .st1, .st2, .st3, .st4, .keys1, .keys4, .leadup, .leaddn, .keyon, .up, .dn, .wheel, .was, .pgbar { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .pgbar { opacity: 1; }
      .pg0 { animation: pg0 22.4s infinite; }
      .pg1 { animation: pg1 22.4s infinite; }
      .pg2 { animation: pg2 22.4s infinite; }
      .pg3 { animation: pg3 22.4s infinite; }
      .st1 { animation: step1 22.4s infinite; }
      .st2 { animation: step2 22.4s infinite; }
      .st3 { animation: step3 22.4s infinite; }
      .st4 { animation: step4 22.4s infinite; }
      .keys1 { animation: keys1 22.4s infinite; }
      .keys4 { animation: keys4 22.4s infinite; }
      .leadup { animation: leadup 22.4s infinite; }
      .leaddn { animation: leaddn 22.4s infinite; }
      .keyon { animation: keyon 22.4s infinite; }
      .up { animation: up 22.4s infinite; }
      .dn { animation: dn 22.4s infinite; }
      .wheel { animation: wheel 22.4s infinite; }
      .was { animation: was 22.4s infinite; }
      .grow { animation: grow 22.4s infinite; }
      .loop { animation: loop 22.4s infinite; }
    }
