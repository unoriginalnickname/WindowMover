<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img" aria-labelledby="t d">
  <title id="t">Cycling a window to the next monitor</title>
  <desc id="d">A close-up of the taskbar: the cursor rests on a window's taskbar icon, the mouse's forward side button (Mouse5) is held, and the middle button is clicked. The view zooms out to two monitors, and the window cycles to the other monitor, back, and to the other monitor again.</desc>
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .cam { transform-origin: 0 0; }
    .win { transform: translateX(320px); }
    .sel { opacity: 1; }
    .hit, .zoomui, .step, .ring, .ring1, .left, .m2, .m2side, .m2wheel { opacity: 0; }
    .ring, .ring1 { transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: no-preference) {
      .cam    { animation: cam 14s forwards; }
      .win    { animation: hop 14s forwards; }
      .hit    { animation: landed 14s forwards; }
      .zoomui { animation: zoomui 14s forwards; }
      .s1 { animation: step1 14s forwards; }
      .s2 { animation: step2 14s forwards; }
      .s3 { animation: step3 14s forwards; }
      .side  { animation: side 14s forwards; }
      .wheel { animation: wheel 14s forwards; }
      .ring  { animation: ring 14s forwards; }
      .ring1 { animation: ring1 14s forwards; }
      .left  { animation: left 14s forwards; }
      .sel   { animation: sel 14s forwards; }
      .m2    { animation: m2 14s forwards; }
      .m2side, .m2wheel { animation: m2lit 14s forwards; }
    }
    @keyframes cam {
      0%, 37.86% { transform: translate(-80px, -780px) scale(5); animation-timing-function: cubic-bezier(0.4, 0.14, 0.3, 1); }
      40.71%, 100% { transform: translate(0, 0) scale(1); }
    }
    @keyframes zoomui { 0% { opacity: 0; } 2.14%, 35.71% { opacity: 1; } 37.86%, 100% { opacity: 0; } }
    @keyframes step1 { 0%, 2.86% { opacity: 0; } 5%, 100% { opacity: 1; } }
    @keyframes step2 { 0%, 19.29% { opacity: 0; } 21.43%, 100% { opacity: 1; } }
    @keyframes step3 { 0%, 29.29% { opacity: 0; } 31.43%, 100% { opacity: 1; } }
    @keyframes side  { 0%, 20% { opacity: 0; } 22.14%, 35.36% { opacity: 1; } 36.43%, 100% { opacity: 0; } }
    @keyframes wheel { 0%, 32.86% { opacity: 0; } 33.57%, 35.36% { opacity: 1; } 36.43%, 100% { opacity: 0; } }
    @keyframes ring  { 0%, 32.86% { opacity: 0; transform: scale(1); } 33.21% { opacity: 1; transform: scale(1); } 37.14%, 100% { opacity: 0; transform: scale(3.5); } }
    @keyframes ring1 { 0%, 10.71% { opacity: 0; transform: scale(1); } 11.07% { opacity: 1; transform: scale(1); } 17.14%, 100% { opacity: 0; transform: scale(3.5); } }
    @keyframes left  { 0%, 10.71% { opacity: 0; } 11.43%, 15.71% { opacity: 1; } 17.14%, 100% { opacity: 0; } }
    @keyframes sel   { 0%, 10.71% { opacity: 0; } 12.14%, 100% { opacity: 1; } }
    @keyframes m2    { 0%, 39.29% { opacity: 0; } 41.43%, 100% { opacity: 1; } }
    @keyframes hop {
      0%, 42.14% { transform: translateX(0px); animation-timing-function: cubic-bezier(0.2, 0, 0.38, 0.9); }
      45%, 67.14% { transform: translateX(320px); animation-timing-function: cubic-bezier(0.2, 0, 0.38, 0.9); }
      70%, 85% { transform: translateX(0px); animation-timing-function: cubic-bezier(0.2, 0, 0.38, 0.9); }
      87.86%, 100% { transform: translateX(320px); }
    }
    @keyframes landed { 0%, 32.86% { opacity: 0; } 33.21%, 47.14% { opacity: 1; } 48.93%, 64.29% { opacity: 0; } 64.64%, 72.14% { opacity: 1; } 73.93%, 82.14% { opacity: 0; } 82.5%, 90% { opacity: 1; } 91.79%, 100% { opacity: 0; } }
    @keyframes m2lit  { 0%, 32.86% { opacity: 0; } 33.21%, 35.71% { opacity: 1; } 36.79%, 64.29% { opacity: 0; } 64.64%, 67.14% { opacity: 1; } 68.21%, 82.14% { opacity: 0; } 82.5%, 85% { opacity: 1; } 86.07%, 100% { opacity: 0; } }
  </style>

  <defs>
    <clipPath id="s1"><rect x="41.5" y="31.5" width="237" height="147" rx="4.5"/></clipPath>
    <clipPath id="s2"><rect x="361.5" y="31.5" width="237" height="147" rx="4.5"/></clipPath>
  </defs>
  <rect width="640" height="290" rx="12" fill="#0d1117"/>

  <g class="cam">
    <!-- monitors -->
    <g fill="#161b22" stroke="#8b949e" stroke-width="3">
      <rect x="40"  y="30" width="240" height="150" rx="6"/>
      <rect x="360" y="30" width="240" height="150" rx="6"/>
    </g>
    <g fill="#8b949e">
      <rect x="146" y="180" width="28" height="14"/><rect x="122" y="194" width="76" height="6" rx="3"/>
      <rect x="466" y="180" width="28" height="14"/><rect x="442" y="194" width="76" height="6" rx="3"/>
    </g>
    <g font-size="18" text-anchor="middle">
      <text x="160" y="232">Monitor 1</text>
      <text x="480" y="232">Monitor 2</text>
    </g>

    <!-- taskbars -->
    <rect x="41" y="160" width="238" height="19" fill="#30363d" clip-path="url(#s1)"/>
    <rect x="361" y="160" width="238" height="19" fill="#30363d" clip-path="url(#s2)"/>
    <rect x="53" y="162" width="18" height="14" rx="2" fill="#484f58"/>
    <g fill="#8b949e">
      <rect x="77" y="163" width="12" height="12" rx="2"/><rect x="95" y="163" width="12" height="12" rx="2"/>
      <rect x="113" y="163" width="12" height="12" rx="2"/><rect x="131" y="163" width="12" height="12" rx="2"/>
      <rect x="373" y="163" width="12" height="12" rx="2"/><rect x="391" y="163" width="12" height="12" rx="2"/>
      <rect x="409" y="163" width="12" height="12" rx="2"/>
    </g>
    <rect x="56" y="163" width="12" height="12" rx="2" fill="#2f81f7" stroke="#ffffff" stroke-width="0.8"/>
    <rect class="sel" x="57" y="176" width="10" height="1.6" rx="0.8" fill="#ffffff"/>

    <!-- the window, starting on monitor 1 -->
    <g class="win">
      <rect x="100" y="70" width="120" height="80" rx="5" fill="#2f81f7"/>
      <rect x="100" y="70" width="120" height="18" rx="5" fill="#1f6feb"/>
      <rect x="100" y="80" width="120" height="8" fill="#1f6feb"/>
      <g fill="#ffffff"><circle cx="112" cy="79" r="3"/><circle cx="123" cy="79" r="3"/><circle cx="134" cy="79" r="3"/></g>
      <rect x="110" y="100" width="70" height="6" rx="3" fill="#ffffff" opacity="0.85"/>
      <rect x="110" y="114" width="90" height="6" rx="3" fill="#ffffff" opacity="0.6"/>
      <rect x="110" y="128" width="55" height="6" rx="3" fill="#ffffff" opacity="0.6"/>
      <rect class="hit" x="96" y="66" width="128" height="88" rx="8" fill="none" stroke="#f0883e" stroke-width="4"/>
    </g>

    <!-- cursor on the window's taskbar icon, and the click ring -->
    <circle class="ring1" cx="62" cy="169" r="3" fill="none" stroke="#f0883e" stroke-width="1"/>
    <circle class="ring" cx="62" cy="169" r="3" fill="none" stroke="#f0883e" stroke-width="1"/>
    <polygon points="0,0 0,12 3,9 5.5,14 7.5,13 5,8 9,8" transform="translate(62 169)" fill="#ffffff" stroke="#0d1117" stroke-width="0.6"/>
  </g>

  <!-- zoomed view: what to press -->
  <g class="zoomui">
    <g font-size="24">
      <text class="step s1" x="24" y="165">Click the window's taskbar icon</text>
      <text class="step s2" x="24" y="199">Hold Mouse5, the side button</text>
      <text class="step s3" x="24" y="233">Middle-click to cycle monitors</text>
    </g>
    <g transform="translate(430 140)">
      <rect x="0" y="0" width="70" height="96" rx="32" fill="#161b22" stroke="#8b949e" stroke-width="3"/>
      <line x1="0" y1="42" x2="70" y2="42" stroke="#8b949e" stroke-width="3"/>
      <line x1="35" y1="0" x2="35" y2="42" stroke="#8b949e" stroke-width="3"/>
      <rect x="29" y="12" width="12" height="22" rx="6" fill="#30363d" stroke="#8b949e" stroke-width="2"/>
      <path class="left" d="M35 0 H32 A32 32 0 0 0 0 32 V42 H35 Z" fill="#f0883e"/>
      <rect class="wheel" x="26" y="9" width="18" height="28" rx="9" fill="#f0883e"/>
      <rect x="-8" y="40" width="10" height="14" rx="3" fill="#30363d" stroke="#8b949e" stroke-width="2"/>
      <rect x="-8" y="60" width="10" height="14" rx="3" fill="#30363d" stroke="#8b949e" stroke-width="2"/>
      <rect class="side" x="-12" y="38" width="18" height="18" rx="4" fill="#f0883e"/>
    </g>
  </g>

  <!-- the small mouse, lit while the window is lit: same orange, same moment -->
  <g class="m2" transform="translate(302.5 230) scale(0.5)">
    <rect x="0" y="0" width="70" height="96" rx="32" fill="#161b22" stroke="#8b949e" stroke-width="3"/>
    <line x1="0" y1="42" x2="70" y2="42" stroke="#8b949e" stroke-width="3"/>
    <line x1="35" y1="0" x2="35" y2="42" stroke="#8b949e" stroke-width="3"/>
    <rect x="-8" y="40" width="10" height="14" rx="3" fill="#30363d" stroke="#8b949e" stroke-width="2"/>
    <rect x="-8" y="60" width="10" height="14" rx="3" fill="#30363d" stroke="#8b949e" stroke-width="2"/>
    <rect class="m2side" x="-12" y="38" width="18" height="18" rx="4" fill="#f0883e"/>
    <rect class="m2wheel" x="26" y="9" width="18" height="28" rx="9" fill="#f0883e"/>
  </g>
</svg>
